name: Release

# v* タグの push で GitHub Release を作成する。手動実行時は成果物 (artifact) の作成のみ。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # netdbg リリースの元コミット（engine-release.version と揃える）
      ENGINE_REF: be8061e50f987aecfe386877b31adf002cce9f3c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 逆コンパイル ヘルパーのビルドに使う
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "タグ $tag と package.json の version ($version) が一致しません。package.json を更新してからタグを付け直してください。"
          }

      # デバッグエンジンは netdbg の GitHub Releases から配置（CI と同じ scripts/fetch-engine-release.ps1）
      - name: Place the debug engine (x86 / x64) from GitHub Releases
        shell: pwsh
        run: ./scripts/fetch-engine-release.ps1

      # 壊れた VSIX を公開しないよう、パッケージ前に単体テストを通す（E2E は CI ワークフローで実行）
      - name: Unit tests
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw "npm ci に失敗しました (exit code $LASTEXITCODE)。" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "単体テストが失敗しました (exit code $LASTEXITCODE)。" }

      - name: Package VSIX
        shell: pwsh
        run: ./scripts/install.ps1 -SkipInstall

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/netdbg.vsix "dist/netdbg-$version.vsix"
          Copy-Item scripts/install-vsix.ps1 dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem dist).FullName
          gh release create '${{ github.ref_name }}' @assets --title '${{ github.ref_name }}' --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release の作成に失敗しました (exit code $LASTEXITCODE)。" }
