name: CI

# push / pull request ごとに単体テストと E2E テスト（本物のデバッグエンジンを使う）を実行する。E2E は x86 と x64 の両方。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      # E2E のテストアプリ（x86）を動かす x86 版 .NET ランタイムの場所
      DOTNET_ROOT(x86): C:\Program Files (x86)\dotnet
      # netdbg リリースの元コミット（エンジンを上げるときは engine-release.version と ENGINE_REF を両方更新して E2E を通す）
      ENGINE_REF: db16f8c026510cc959b9908abe80e94c6ac55a64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # テストアプリ・逆コンパイル ヘルパーのビルドに使う
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # x86 アプリを動かすための x86 版ランタイム（WinForms のテストアプリ用に Windows Desktop も）
      - name: Install the x86 .NET runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $root = 'C:\Program Files (x86)\dotnet'
          # dotnet-install.ps1 はスクリプトなので $LASTEXITCODE を設定しない（失敗時は例外になる）。
          # 念のため、インストール先にランタイムができたかを確かめる。
          foreach ($runtime in @{ name = 'dotnet'; folder = 'Microsoft.NETCore.App' }, @{ name = 'windowsdesktop'; folder = 'Microsoft.WindowsDesktop.App' }) {
            & $installer -Channel 10.0 -Runtime $runtime.name -Architecture x86 -InstallDir $root -NoPath
            if (-not (Test-Path (Join-Path $root "shared\$($runtime.folder)"))) {
              throw "x86 版 $($runtime.name) ランタイムが $root にインストールされていません。上のログを確認してください。"
            }
          }
          Get-ChildItem (Join-Path $root 'shared') -Directory | ForEach-Object { "$($_.Name): $((Get-ChildItem $_.FullName -Directory).Name -join ', ')" }

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Unit tests
        run: npm test

      # デバッグエンジンは netdbg の GitHub Releases から配置（scripts/engine-release.version、ローカル install.ps1 と同じ）
      - name: Place the debug engine (x86 / x64) from GitHub Releases
        shell: pwsh
        run: ./scripts/fetch-engine-release.ps1

      # Fresh EncDelta.dll is often scanned on first start; the engine does that inside module-load and E2E then times out.
      - name: Warm up the Edit and Continue helper
        shell: pwsh
        run: |
          $sdk = (dotnet --list-sdks | Select-Object -Last 1)
          if (-not $sdk) { throw 'dotnet --list-sdks returned nothing.' }
          if ($sdk -notmatch '^(\S+)\s+\[(.+)\]') { throw "Cannot parse SDK line: $sdk" }
          $roslyn = Join-Path $Matches[2] $Matches[1] 'Roslyn' 'bincore'
          foreach ($arch in 'x86', 'x64') {
            $dll = Join-Path "debugger/netdbg-$arch/encdelta" 'EncDelta.dll'
            if (-not (Test-Path $dll)) { throw "missing $dll" }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'dotnet'
            $psi.Arguments = "`"$dll`" --roslyn `"$roslyn`""
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.StandardInput.Close()
            if (-not $p.WaitForExit(60000)) {
              $p.Kill()
              throw "EncDelta ($arch) did not exit within 60s during warm-up."
            }
          }

      - name: E2E tests (x86)
        run: npm run test:e2e

      # x64 のエンジンで、x64 でビルドしたテストアプリを (x64 の .NET は windows-latest に入っている)
      - name: E2E tests (x64)
        shell: pwsh
        run: |
          $env:NETDBG_E2E_ARCH = 'x64'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "x64 の E2E テストが失敗しました (exit code $LASTEXITCODE)。" }
