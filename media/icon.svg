<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Extension icon: a .NET x86 chip with a breakpoint and the current-line arrow. Rendered to media/icon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a3de8"/>
      <stop offset="1" stop-color="#3a1c9c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <!-- chip pins -->
  <g fill="#c9b8ff" opacity="0.55">
    <rect x="70" y="30" width="14" height="22" rx="4"/><rect x="104" y="30" width="14" height="22" rx="4"/><rect x="138" y="30" width="14" height="22" rx="4"/><rect x="172" y="30" width="14" height="22" rx="4"/>
    <rect x="70" y="204" width="14" height="22" rx="4"/><rect x="104" y="204" width="14" height="22" rx="4"/><rect x="138" y="204" width="14" height="22" rx="4"/><rect x="172" y="204" width="14" height="22" rx="4"/>
  </g>
  <!-- chip body -->
  <rect x="44" y="50" width="168" height="156" rx="22" fill="#1e1147" stroke="#c9b8ff" stroke-opacity="0.6" stroke-width="4"/>
  <text x="128" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="46" fill="#c9b8ff">.NET</text>
  <text x="150" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="64" fill="#ffffff" letter-spacing="-2">x86</text>
  <!-- current-line arrow (as VS Code shows where the program stopped) and a breakpoint -->
  <path d="M56 144 L72 144 L72 133 L91 160 L72 187 L72 176 L56 176 Z" fill="#ffcc00" stroke="#1e1147" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="204" cy="52" r="26" fill="#e51400" stroke="#ffffff" stroke-width="7"/>
</svg>
